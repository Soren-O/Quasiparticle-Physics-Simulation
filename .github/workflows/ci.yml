name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy qpsim
      - name: Test (pytest)
        run: pytest
      # The default addopts deselect `slow`, so the paper regression / slow
      # validation tests would never run in CI otherwise. `-m slow` overrides
      # the not-slow default and runs exactly that surface.
      - name: Test (slow / paper validation)
        run: pytest -m slow
