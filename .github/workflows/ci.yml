name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The certified cross-platform envelopes were measured with single-thread
    # BLAS.  Leaving runner-dependent defaults here changes reduction order
    # enough to select a different roundoff-limited Newton/Picard stop.
    env:
      BLIS_NUM_THREADS: "1"
      MKL_DYNAMIC: "FALSE"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy qpsim
      - name: Verify qp-diffusion symbolic identities
        run: make -C papers/qp-diffusion verify PY=python
      - name: Test (pytest)
        run: pytest
      # The default addopts deselect `slow`, so the paper regression / slow
      # validation tests would never run in CI otherwise. The full Fischer
      # Fig. 6 paper sweep is a separate manual target (measured ~6.04 h
      # serial / ~2.11 h concurrent); its fast metadata and cache-wiring
      # guards remain in the default suite.
      - name: Test (slow / paper validation)
        timeout-minutes: 180
        run: pytest -m "slow and not manual_slow"
