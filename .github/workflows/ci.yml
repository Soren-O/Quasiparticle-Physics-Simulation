name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy qpsim
      - name: Verify qp-diffusion symbolic identities
        run: make -C papers/qp-diffusion verify PY=python
      - name: Test (pytest)
        run: pytest
      # The default addopts deselect `slow`, so the paper regression / slow
      # validation tests would never run in CI otherwise. The full Fischer
      # Fig. 6 paper sweep is a separate ~14 h manual target; its fast metadata
      # and cache-wiring guards remain in the default suite.
      - name: Test (slow / paper validation)
        timeout-minutes: 180
        # Pin the BLAS thread count: the low-occupancy Picard/Newton chains
        # amplify thread-count-dependent reduction rounding ~1e11x, which is
        # what made fig7's cold points "non-deterministic" across runners
        # (AUDIT-2026-08-01-fanout.md F1). One thread makes a given runner
        # arch bitwise reproducible (cross-arch kernel variance remains).
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -m "slow and not manual_slow"
