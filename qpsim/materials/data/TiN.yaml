# TiN on silicon — generic starter values.
# Note: TiN gap depends strongly on deposition parameters; adjust Delta_0
# and T_c to match your specific film.
name: TiN
Delta_0: 700.0       # μeV (typical for ~40 nm films)
T_c: 4.5             # K
tau_0: 0.5           # ns (varies with film quality)
# D_0 provenance (2026-08-03 review — flagged, NOT corrected): the stored
# 10.0 μm²/ns is a starter value, not a measured one, and it does not describe
# the disordered film class this file's rho_F cites. Via the Einstein relation
# σ = e² N(0) D with N(0) = 2·rho_F it implies ρ = 0.82 μΩ·cm, a 30 nm mean
# free path inside a 40 nm film, and a dirty-limit ξ = √(ħD/Δ) = 97 nm. TiN
# KID films of the cited Gao/Leduc class are ρ ≈ 30-200 μΩ·cm, i.e.
# D ≈ 0.27-0.04 μm²/ns and ξ ≈ 16-6 nm — roughly 100× smaller than stored.
# Correcting the number is a physics change (it shortens every spatial TiN
# diffusion length √(Dτ) by ~11×) and needs a physicist sign-off, so the
# shipped value is left alone and the inconsistency recorded here.
D_0: 10.0            # μm²/ns (normal-state; see the provenance note above)
D_0_range: [0.041, 0.274]
notes: >-
  Tunable T_c via nitrogen content; the KID material. Strongly disordered,
  so the diffusion constant is two orders below Al. The stored D_0 does not
  describe that film class -- see the provenance note above.
references:
  - "Leduc et al., APL 97 (2010) — TiN for kinetic inductance detectors"
  - "Gao et al. (2012) — the KID film class this entry's rho_F cites, rho ~ 30-200 uOhm-cm"
v_F: 1.0e6           # m/s
# Film-dependent: rounded from the 3.9e10 eV^-1 um^-3 single-spin value
# derived from TiN pulse response by Gao et al., APL 101, 142602 (2012).
# The earlier band-theory estimate is 8.7e9 eV^-1 um^-3 (Leduc 2010).
rho_F: 3.8e28        # eV⁻¹ m⁻³ (single-spin DOS at Fermi level)
sound_velocity_longitudinal: 9200.0
sound_velocity_transverse: 5800.0
film_thickness: 40.0
substrate_transmission_eta: 0.4       # TiN/Si AMM
substrate:
  name: Si
  density: 2329.0
  sound_velocity: 8433.0
