# TiN on silicon — generic starter values.
# Note: TiN gap depends strongly on deposition parameters; adjust Delta_0
# and T_c to match your specific film.
name: TiN
Delta_0: 700.0       # μeV (typical for ~40 nm films)
T_c: 4.5             # K
tau_0: 0.5           # ns (varies with film quality)
# D_0 provenance (flagged by the 2026-08-03 review, CORRECTED 2026-08-17 under
# the adjudicated P14). The former 10.0 μm²/ns was a starter value, not a
# measured one, and it described no real TiN film: via the Einstein relation
# σ = e² N(0) D with N(0) = 2·rho_F it implied ρ = 0.82 μΩ·cm, a 30 nm mean
# free path inside a 40 nm film, and a dirty-limit ξ = √(ħD/Δ) = 97 nm — a
# clean elemental metal, not the disordered nitride this file's rho_F cites.
#
# The stored value is now derived rather than assumed: at ρ = 100 μΩ·cm, the
# canonical Leduc/Gao KID film, the same Einstein relation with this file's
# rho_F = 3.8e28 eV⁻¹ m⁻³ gives D = 8.21/ρ[μΩ·cm] = 0.082 μm²/ns. That implies
# a mean free path 3D/v_F ≈ 0.25 nm — near the Ioffe-Regel limit, as expected
# for a strongly disordered nitride — and a dirty-limit ξ = 8.8 nm, consistent
# with TiN's multi-tesla B_c2. It now also falls inside this file's own
# D_0_range, which the old value did not.
#
# This is a physics change and it moves numbers: every spatial TiN diffusion
# length √(Dτ) shortens by ~11×, and D itself drops by 122×. No published
# figure uses TiN.
D_0: 0.082           # μm²/ns (normal-state; derived above from ρ = 100 μΩ·cm)
D_0_range: [0.041, 0.274]
notes: >-
  Tunable T_c via nitrogen content; the KID material. Strongly disordered,
  so the diffusion constant is two orders below Al. The stored D_0 does not
  describe that film class -- see the provenance note above.
references:
  - "Leduc et al., APL 97 (2010) — TiN for kinetic inductance detectors"
  - "Gao et al. (2012) — the KID film class this entry's rho_F cites, rho ~ 30-200 uOhm-cm"
v_F: 1.0e6           # m/s
# Film-dependent: rounded from the 3.9e10 eV^-1 um^-3 single-spin value
# derived from TiN pulse response by Gao et al., APL 101, 142602 (2012).
# The earlier band-theory estimate is 8.7e9 eV^-1 um^-3 (Leduc 2010).
rho_F: 3.8e28        # eV⁻¹ m⁻³ (single-spin DOS at Fermi level)
sound_velocity_longitudinal: 9200.0
sound_velocity_transverse: 5800.0
film_thickness: 40.0
substrate_transmission_eta: 0.4       # TiN/Si AMM
substrate:
  name: Si
  density: 2329.0
  sound_velocity: 8433.0
