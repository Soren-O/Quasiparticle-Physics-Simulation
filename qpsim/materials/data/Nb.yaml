# Niobium on silicon — generic starter values.
# Note: Nb is moderately strong-coupling. The implied Δ₀/(k_B T_c) =
# 1.882 here departs from the finite-cutoff BCS weak-coupling value 1.76374.
# qpsim.physics.gap_equation.calibrate_gap makes the declared T_c authoritative
# so the modeled gap closes continuously there; a supplied measured Delta_0 is
# retained as diagnostic metadata and does not become a second coupling anchor.
# Quantitative strong-coupling gap work needs a model beyond this BCS kernel.
# See docs/Material_Database.md.
name: Nb
Delta_0: 1500.0      # μeV (Δ(0) ≈ 1.5 meV for Nb)
T_c: 9.25            # K
tau_0: 0.149         # ns (Kaplan 1976 for Nb — much faster than Al)
tau_0_phonon: 0.00417  # ns (Kaplan 1976 Table II; phonon τ_0^ph for Nb)
D_0: 25.0            # μm²/ns (see the band below; sputtered films run far lower)
D_0_range: [0.5, 2.0]
notes: >-
  Strong-coupling superconductor (2 Delta / k_B T_c ~ 3.8). Sputtered films
  have a short mean free path and correspondingly low D_0; the stored value
  describes a much cleaner film than the band's reference class.
references:
  - "Kaplan et al., PRB 14 (1976) — recombination/scattering times, BCS parameters"
  - "Bal et al., PR Applied 20 (2023) — quasiparticle spectroscopy in Nb transmon films"
v_F: 1.37e6          # m/s
rho_F: 5.4e28        # eV⁻¹ m⁻³ (single-spin DOS at Fermi level)
sound_velocity_longitudinal: 5100.0
sound_velocity_transverse: 2100.0
film_thickness: 100.0
substrate_transmission_eta: 0.25      # Nb/Si AMM estimate
substrate:
  name: Si
  density: 2329.0
  sound_velocity: 8433.0
