# Niobium on silicon — generic starter values.
# Note: Nb is moderately strong-coupling. The implied Δ₀/(k_B T_c) =
# 1.882 here departs from the BCS weak-coupling 1.764 that
# qpsim.physics.gap_equation.calibrate_gap assumes when deriving Δ
# from T_c. With these values, calibrate_gap(T_c=9.25) returns
# Δ ≈ 1407 μeV, ~7% below the 1500 μeV listed below. For Nb work,
# pass Delta_0 = 1500 explicitly downstream rather than letting the
# calibrator derive it from T_c. See docs/Material_Database.md.
name: Nb
Delta_0: 1500.0      # μeV (Δ(0) ≈ 1.5 meV for Nb)
T_c: 9.25            # K
tau_0: 0.149         # ns (Kaplan 1976 for Nb — much faster than Al)
tau_0_phonon: 0.00417  # ns (Kaplan 1976 Table II; phonon τ_0^ph for Nb)
D_0: 25.0            # μm²/ns
v_F: 1.37e6          # m/s
rho_F: 5.4e28        # J⁻¹ m⁻³
sound_velocity_longitudinal: 5100.0
sound_velocity_transverse: 2100.0
film_thickness: 100.0
substrate_transmission_eta: 0.25      # Nb/Si AMM estimate
substrate:
  name: Si
  density: 2329.0
  sound_velocity: 8433.0
